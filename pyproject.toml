[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "crag-ingestion"
version = "0.1.0"
description = "Auditable document ingestion pipeline for a Corrective RAG system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pypdf>=5.0,<7",
]

[project.optional-dependencies]
semantic = ["sentence-transformers>=3.0,<6"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
crag-ingest = "crag_ingestion.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

